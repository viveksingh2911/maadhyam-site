{% import "partials/icons.html" as ico %}<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in &middot; {{ cfg.site_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ static_url('/static/css/admin.css') }}">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    try {
      var t = localStorage.getItem('mi-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <span class="sidebar-mark">MI</span>
    <h1 style="font-size:1.3rem">Sign in</h1>
    <p class="small muted">Content management for {{ cfg.site_name }}.</p>

    {% if error %}
    <div class="alert alert-danger mt-2">{{ ico.icon('alert', 17) }} That email and password combination did not work.</div>
    {% endif %}

    <form method="post" action="/admin/login" class="mt-3">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-block" type="submit">Sign in</button>
    </form>

    <p class="tiny muted mt-3 mb-0">
      <a href="/">Back to the public site</a>
    </p>
  </div>
</div>
</body>
</html>
